# This Cloud Build pipeline uses the cos-customizer tool to build a custom GKE COS image
# with a pre-installed NVIDIA GPU driver.

options:
  # Send build logs to Cloud Logging.
  logging: CLOUD_LOGGING_ONLY
  dynamicSubstitutions: true
  machineType: "N1_HIGHCPU_32" # As used in the test example for build performance
  diskSizeGb: 100 # Example: Increase to 100GB 

substitutions:
  _SHORT_BUILD_ID: ${BUILD_ID:0:8}
  _GOLDEN_BASE_IMAGE: "gke-1341-gke2037002-cos-125-19216-0-94-c-nvda" # Your chosen x86 base image
  # _GOLDEN_BASE_IMAGE: "gke-1341-gke3899001-cos-125-19216-104-45-c-nvda" # Your chosen x86 base image
  _GOLDEN_BASE_IMAGE_PROJECT: "gke-release-staging" # Project hosting the golden images (confirm if correct)
  _GCS_BUCKET: "${PROJECT_ID}_cloudbuild" # Default bucket for cos-customizer
  _ZONE: "us-central1-a" # Specify a zone for the builder VM
  _TARGET_IMAGE_NAME: "your-custom-image-name" # Choose a name for your output image
  _TARGET_IMAGE_FAMILY: "your-custom-image-family" # Choose a family name
  _NVIDIA_DRIVER_FILENAME: "NVIDIA-Linux-x86_64-580.126.09.run"
  _DRIVER_GCS_PATH: "gs://cos-nvidia-gpu-drivers/NVIDIA-Linux-x86_64-580.126.09.run"
  #_DRIVER_GCS_PATH: "gs://shuoyiluo-gke-preload/NVIDIA-Linux-x86_64-580.126.09.run"
  _COS_CUSTOMIZER: "gcr.io/cos-cloud/cos-customizer:v20251204" # Using the public cos-customizer image

steps:
# Step 1: Initialize the image build process.
- name: "${_COS_CUSTOMIZER}"
  args: ["start-image-build",
         "-image-name=${_GOLDEN_BASE_IMAGE}",
         "-image-project=${_GOLDEN_BASE_IMAGE_PROJECT}",
         "-gcs-bucket=${_GCS_BUCKET}",
         "-gcs-workdir=cos-customizer-$BUILD_ID"]
  id: "start-image-build"

# Step 2: Copy the NVIDIA driver from your GCS bucket.
- name: "gcr.io/cloud-builders/gsutil"
  args: ["cp", "${_DRIVER_GCS_PATH}", "./${_NVIDIA_DRIVER_FILENAME}"]
  id: "copy-driver"

# Step 2.5: Run the customization script from the repository.
- name: "${_COS_CUSTOMIZER}"
  args: ["run-script",
         "-script=scripts/cos/setup.sh"]
  id: "run-setup-script"
  waitFor: ["start-image-build"]
  
# Step 3: Install the GPU driver using cos-customizer.
- name: "${_COS_CUSTOMIZER}"
  args: ["install-gpu",
         "-version=./${_NVIDIA_DRIVER_FILENAME}",
         "-gpu-type="] # Specify GPU type if needed, e.g., "NVIDIA_H100". Leave empty to auto-detect.
  id: "install-driver"
  waitFor: ["copy-driver", "run-setup-script"] # Wait for both copy and clean

# Step 3.5: Persist driver files by copying them to /home/kubernetes/bin/nvidia.
- name: "${_COS_CUSTOMIZER}"
  args: ["run-script",
          "-script=scripts/cos/copy_driver.sh"] 
  id: "run-copy-driver-script" 
  waitFor: ["install-driver"]

# Step 3.6: Install the systemd service for fast GPU driver loading.
- name: "${_COS_CUSTOMIZER}"
  args: ["run-script",
          "-script=scripts/cos/install_service.sh"]
  id: "run-install-service-script"
  waitFor: ["run-copy-driver-script"]

# Step 4: Finalize the image build.
- name: "${_COS_CUSTOMIZER}"
  args: ["finish-image-build",
         "-zone=${_ZONE}",
         "-project=$PROJECT_ID",
         "-image-name=${_TARGET_IMAGE_NAME}-${_SHORT_BUILD_ID}",
         "-network=",
         "-subnet=",
         "-machine-type=n1-standard-1",
         "-disk-size-gb=100",
         "-image-family=${_TARGET_IMAGE_FAMILY}",
         "-image-project=$PROJECT_ID",
         "-labels=gke-golden-image=${_GOLDEN_BASE_IMAGE},gke-custom-version=${SHORT_SHA},build-id=${BUILD_ID}"]
  waitFor: ["run-install-service-script"]

timeout: "14400s"
